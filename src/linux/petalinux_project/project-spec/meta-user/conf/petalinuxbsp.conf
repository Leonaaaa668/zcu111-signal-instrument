#User Configuration

#OE_TERMINAL = "tmux"
IMAGE_INSTALL:append = " openssh-sshd openssh-sftp-server"
# Weston compositor + input stack (DRM/KMS + libinput/seatd)
IMAGE_INSTALL:append = " weston weston-init weston-examples seatd"
IMAGE_INSTALL:append = " zcu111-static-network zcu111-weston-fix"
# Qt 5.15 runtime (Widgets + QML) for Weston/Wayland
IMAGE_INSTALL:append = " qtbase qtbase-plugins qtbase-tools qtwayland qtwayland-plugins qtdeclarative qtdeclarative-qmlplugins qtdeclarative-plugins qtquickcontrols2 qtquickcontrols2-qmlplugins"
# SDK: Qt host tools + target dev files
TOOLCHAIN_TARGET_TASK:append = " qtbase-dev qtbase-mkspecs qtwayland-dev qtwayland-mkspecs qtdeclarative-dev qtdeclarative-mkspecs qtquickcontrols2-dev qtquickcontrols2-mkspecs"
TOOLCHAIN_HOST_TASK:append = " nativesdk-qtbase nativesdk-qtbase-dev"
